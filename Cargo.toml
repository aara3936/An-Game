[package]
name = "warfare_simulator_engine"
version = "0.1.0"
edition = "2021"
authors = ["Senior Systems Architect & Rust Game Engine Engineer <engine@strategic-command.internal>"]
description = "Production-Grade Anti-Ballistic & Retaliatory Engine with Throne Thriller 1 Global Radar, VS-90 Protocol Salvo Retaliation, Intercept S-5 Mach 15 Predictive Proportional Navigation, and 120 FPS Deterministic Simulation Loop"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# High-speed SIMD vector and matrix math
glam = { version = "0.28", features = ["serde"] }

# Random number generation with WebAssembly JS support
rand = "0.8.5"
getrandom = { version = "0.2", features = ["js"] }

# Serialization and telemetry export for HUD bridge
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebAssembly bindings and JS integration
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"

# Web-sys DOM, WebGL2, AudioContext, and Canvas bindings
[dependencies.web-sys]
version = "0.3.69"
features = [
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "BiquadFilterNode",
  "BiquadFilterType",
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "GainNode",
  "HtmlCanvasElement",
  "OscillatorNode",
  "OscillatorType",
  "Performance",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "Window",
  "console",
]

[package.metadata.android]
package = "com.strategicdefense.warfare"
apk_label = "Warfare Simulator 3D"
target_sdk_version = 34
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]

[profile.release]
opt-level = "s"       # Optimize for binary throughput and minimal Wasm size
lto = true            # Link-Time Optimization across all crates
codegen-units = 1     # Maximize compiler optimization passes
panic = "abort"       # Strip stack unwinding overhead for WebAssembly
strip = "symbols"     # Strip debug symbols for production Wasm artifact
