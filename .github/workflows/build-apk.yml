name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust Toolchain & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-apk & Android NDK
        run: |
          cargo install cargo-apk
          echo "Android NDK & Rust target set up complete."

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK (Release Mode)
        run: |
          cargo apk build --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simulation-Engine-Game.apk
          path: target/debug/apk/*.apk
