name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-apk:
    name: Compile Rust/Bevy Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android Build Tools & NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-apk

      - name: Install cargo-apk
        run: |
          cargo install cargo-apk --locked

      - name: Compile Native Android APK (Release)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          cargo apk build --release --target aarch64-linux-android

      - name: Locate and Stage Generated APK Artifacts
        run: |
          mkdir -p build-output/apk
          find target -name "*.apk" -type f -exec cp -v {} build-output/apk/ \;
          echo "Generated APK files in build-output/apk/:"
          ls -lh build-output/apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarfareSimulator3D-Android-aarch64-Release
          path: build-output/apk/*.apk
          if-no-files-found: error
          retention-days: 30
